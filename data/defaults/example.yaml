      # Adopt the installed GitOps operator in its existing namespace.
      # The all-namespaces OperatorGroup is already present, so this entry
      # renders the Subscription only. Prune stays off because the operators
      # Application prunes, and deleting this Subscription would remove GitOps.
      openshift-gitops-operator:
        channel: "latest"
        namespaceRef: "gitops.namespaces.operators"
        sourceRef: "gitops.catalogSourceAliases.redhat"
        sourceNamespaceRef: "gitops.namespaces.marketplace"
        installPlanApproval: "Automatic"
        placement: management-operators
        overlay: openshift-gitops-operator
        manageInstallNamespace: false
        resourceSyncOptions: "Prune=false"

