        storageClassName: "px-csi-replicated-default"
        size: "2Gi"
        accessMode: "ReadWriteOnce"
        volumeMode: "Filesystem"
        diskSerial: "SAIFDHCPLEASE01"
        filesystemLabel: "SAIFDHCP"
        mountPath: "/var/lib/saif-worker-dhcp"
        minUsablePercent: 90
        runStrategy: "Manual"
