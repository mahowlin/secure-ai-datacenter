    storage:
      lvms:
        channel: stable-4.19
        catalogSource: redhat-operators-local
      portworx:
        version: 3.7.0
        operatorVersion: 26.3.2
        storkVersion: 26.4.1
        # maintainer-approved lab exception: operator 26.3.2 misparses the digest
        # in the CSI provisioner reference and emits obsolete CLI flags.
        # Transport verifies this tag against the locked digest below before
        # publication; Bee verifies again before rollout. Remove when fixed.
        csiProvisionerTagOnlyCompatibility: true
        # Portworx documents anyuid for its Stork webhook on OpenShift. The
