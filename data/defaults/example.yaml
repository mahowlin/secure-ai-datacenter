      image: "registry.example.com:5000/openshift4/ose-tools-rhel9@sha256:5b0e849193d864cecf0dfb2c4cea5dca9ee86847a07c228687b5952a5698cbac"
      allocationAnnotation: "saif.example.com/worker-ipam-allocation"
      macPrefix: "02:a6:c3"
      networkBinding: "isovalent"
      orphanGraceSeconds: 600
      probeTimeoutSeconds: 5
      # One observed zero-replica HCP bridge fixture; remove after exact inverse.
      hcpBridgeExperiment:
        namespace: clusters-example-tenant-a-example-tenant-a
        clusterName: example-tenant-a-mbmgw
        nodePool: example-tenant-a-workers-rwx-bridge
        machineSetName: example-tenant-a-workers-rwx-bridge
        machineSetUid: 90c60b83552d4839b5e3b5b5360fec3c
        nad: helper3-hcp-route-bridge
        slot: example-tenant-a-example-tenant-a-workers-2
        ipv4: 192.0.2.33
        mac: "02:00:5E:00:53:30"
      # Held in PR186 until reviewed installer readiness and target cutover.
      # Existing .32/.33 workers keep their exact legacy attachments.
      hcpBridgeNodePools:
        - namespace: clusters-example-tenant-a-example-tenant-a
          clusterName: example-tenant-a-mbmgw
          nodePool: example-tenant-a-workers-rwx-bridge
          machineSetName: example-tenant-a-workers-rwx-bridge
          machineSetUid: 90c60b83552d4839b5e3b5b5360fec3c
          inputNad: helper3-hcp-route-bridge
          nad: saif-example-tenant-a-route-8fc6280669bg
          maxReplicas: 3
          phase: active
          legacyAttachments:
            - name: example-tenant-a-workers-rwx-bridge-zjtm2
              vmUid: 596443a9a60d43dbb36c5df6cd6d19e9
              nad: helper3-hcp-route-bridge
              slot: example-tenant-a-example-tenant-a-workers-2
              leaseUid: e2ad70d44d7c4044b1e086127266bbac
      # A zero-worker HostedCluster/NodePool must exist before its MachineSet
      # UID can be observed. Active status renders its versioned NAD/helper;
      # only then may workerReplicasByCluster advance above zero.
      bridgeActivation:
        installerNamespace: saif-peer-route-installer
        # v1.32 kubelet rotates near 80% TTL; allow its observed 1m sync
        # (90s jitter budget), then host copy, before the unchanged 120s guard.
        credentialLifecycle:
          projectedTokenExpirationSeconds: 1800
          projectionRenewalBudgetSeconds: 90
          minimumCniValiditySeconds: 120
          hostRefreshIntervalSeconds: 1
          readinessRetryWindowSeconds: 3
          readinessTimeoutSeconds: 5
      # Explicit retained one-worker inventory exception, never fresh admission.
      retainedFixtures:
        - namespace: clusters-example-tenant-a-example-tenant-a
          name: example-tenant-a-workers-rwx-j8zg7
          nodePool: example-tenant-a-workers-rwx
          vmUid: 1c4b9bcca29c479982385a2b52cbb0cb
          leaseUid: f110bb0f836b4685b69902f45a8d0693
          leaseName: saif-worker-ipam-allocation-1bef360190c3c9bba8bde0f7
          slot: example-tenant-a-example-tenant-a-workers-1
          ipv4: 192.0.2.32
          mac: "02:a6:c3:60:63:6b"
          nad: helper1-5430-route-mirror

