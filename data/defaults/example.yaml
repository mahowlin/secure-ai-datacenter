# Example site shared infrastructure defaults
#
# Consumed by resolver.py → exposed as resolved defaults to all renderers.
# Contains cross-repo environment facts and platform-level deployment defaults
# that renderers consume as explicit desired-state input.
#
# Ownership boundary — do NOT add here:
#   - UCS org/pools/firmware/BIOS/boot/storage policies (owned by saif-ai-pod)
#   - NAC/ACI resource-native defaults (owned by secure-ai-fabric)
#   - Target-repo execution mechanics, workflows, credentials, and state
#   - Secret values or credentials

kind: PlatformDefaults
metadata:
  name: example

spec:
  # Reviewed family policy retained from the existing resolver; not proof of an installed exact tuple.
  # Add a pair only after reviewing vendor documentation and exact release/archive facts.
  day1Compatibility:
    - openshiftMinor: '4.19'
      ciliumChannel: '1.18'
      evidence: https://access.redhat.com/articles/5436171
    - openshiftMinor: '4.19'
      ciliumChannel: '1.19'
      evidence: https://access.redhat.com/articles/5436171
    - openshiftMinor: '4.20'
      ciliumChannel: '1.19'
      evidence: https://access.redhat.com/articles/5436171
  # Cross-repo environment facts. Renderers read these; they do not embed them.
  identity:
    apiGroup: saif.example.com
    baseDomain: example.com
    chartRepository: registry.example.com:5000/charts/clife-install
    sourceRepositories:
      sysAdmin: mahowlin/secure-ai-airgap
      gitops: mahowlin/secure-ai-gitops
      platform: mahowlin/secure-ai-datacenter
      aci: mahowlin/secure-ai-fabric
      openshift: mahowlin/secure-ai-compute
    # Existing reusable target roots; generated overrides share these owners.
    gitopsFoundation:
      core: clusters/_base/tier1-core
      isovalent: clusters/_base/tier2-isovalent
    templateRoots:
      clusterInstall: cluster-install
      gitops: gitops
    generatedRepos:
      aci: secure-ai-fabric
      openshift: secure-ai-compute
      gitops: secure-ai-gitops
    labelDomains:
      poc: poc.isovalent.com
      scaffold: platform.example.com
    derivationOwner: secure-ai-datacenter resolver and renderer
    publicImageRegistries:
      - quay.io/
      - registry.redhat.io/
      - registry.connect.redhat.com/
      - docker.io/
      - ghcr.io/
      - gcr.io/
      - nvcr.io/
    ilb:
      source: data/ilb/example-tenant-poc
      stagedKustomization: clusters/_staged/ilb-example-tenant-a/kustomization.yaml
      stagedResource: ../_staged/ilb-example-tenant-a
      stagedRoot: clusters/_staged/ilb-example-tenant-a
      hostedOverlay: apps/hcp/tenant/ilb-poc/overlays/example-tenant-a
      edgeOverlay: ilb-example-tenant-a-edge
      authSecret: example-tenant-a-k8sbackend-auth
      renewSourceName: example-tenant-a-ilb-credential-renew-source
      controllerNamespace: ilb-hcp-pip-controller
      hostedDestinationName: example-tenant-a
      hostedDestinationNamespace: ilb-poc
      applicationNames:
        hosted: example-tenant-a-ilb-hosted
        controller: example-tenant-a-ilb-controller
        renewal: example-tenant-a-ilb-credential-renewal
        registration: example-tenant-a-ilb-registration
        edge: example-tenant-a-ilb-edge
    managementNodes:
      - example-node-2.example.com
      - example-node-3.example.com
      - example-node-4.example.com
    excludedNodeSubstrings:
      - example-sno
    canaryNode: example-node-2.example.com
    currentRouteNode: example-node-4.example.com
    preflightNode: example-node-2.example.com
    diagnosticOverlay: diagnostic-vlan2101
    ilbAdapterImage: registry.example.com:5000/ilb-hcp-backend-adapter
    ilbAdapterDigest: sha256:1e0d72a64f206b709acfd12d311da58b43d145a4d05f9af22131e040c5afd0eb
    mutatorAnnotationDomain: workload-mutator.example.com
    mutatorWebhookName: hcp-workers.example.com
    productionEgressCIDR: 198.18.12.33/32
    conformance:
      ilbNamespace: extlb-example-tenant-a-pip
      ilbVip: 198.18.11.19
      ilbPort: 8080
      routeNamespace: clusters-example-tenant-a-example-tenant-a
      routeHosts:
        kube-apiserver: api.example-tenant-a.example.com
        ignition-server: ignition.example-tenant-a.example.com
        konnectivity-server: konnectivity.example-tenant-a.example.com
      consoleHost: console-openshift-console.apps.example-shared.example.com
      consoleAddress: 198.18.14.17
      hostedService:
        backendCluster: example-tenant-a
        namespace: ilb-poc
        name: echo
        selectorLabel: poc.isovalent.com/ilb-hcp-pip
  # --- Shared infrastructure services ---
  dns:
    servers:
      - "198.19.3.188"
      - "198.19.3.189"
  ntp:
    servers:
      - "198.19.49.151"

  registry:
    url: "registry.example.com:5000"

  releaseImageRepository: "registry.example.com:5000/openshift/release-images"

