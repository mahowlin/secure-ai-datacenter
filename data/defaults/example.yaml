      localRegistryApplication: 4
      consoleLoginSecret: 8
      consoleLoginManagement: 9
      hostedClustersApplication: 10
      hostedCluster: 10
      nodePool: 11
      argocdClusterSecret: 12
      tenantCatalogsApplication: 13
      tenantSealedSecretsApplication: 14
      guestCniApplication: 15
      tenantObservabilityApplication: 16
