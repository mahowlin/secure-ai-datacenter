      operators: "openshift-operators"
      mce: "multicluster-engine"
      nmstate: "openshift-nmstate"
      hcpWorkerDhcp: "hcp-worker-dhcp"
      storage: "openshift-storage"
      storageReadiness: "saif-storage-readiness"
      timescape: "hubble-timescape"
      portworx: "portworx"

    syncWaves:
      argocdConfig: -15
      platformIdmsManagement: -10
      namespace: -5
      operatorGroup: -4
      subscription: -3
      nmstate: -2
      networkAttachmentDefinition: -1
      workerDhcp: 0
      workerIpam: 0
      bgp: 1
      isovalentVectorExporter: 1
      bgpAdvertisement: 2
      hcpOperatorsApplication: 5
      hcpOperandsApplication: 6
      ilbRouterPlacementApplication: 7
      ciliumReleaseApplication: 8
      ilbT2PlacementApplication: 9
