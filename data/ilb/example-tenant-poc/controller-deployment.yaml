apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilb-hcp-pip-controller
  namespace: ilb-hcp-pip-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ilb-hcp-pip-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ilb-hcp-pip-controller
    spec:
      serviceAccountName: ilb-hcp-pip-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --remote-resync=30s
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
