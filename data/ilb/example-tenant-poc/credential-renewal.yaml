apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-tenant-a-ilb-credential-renewer
  namespace: ilb-hcp-pip-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: example-tenant-a-ilb-read-admin
  namespace: clusters-example-tenant-a
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [example-tenant-a-admin-kubeconfig]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-tenant-a-ilb-read-admin
  namespace: clusters-example-tenant-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: example-tenant-a-ilb-read-admin
subjects:
  - kind: ServiceAccount
    name: example-tenant-a-ilb-credential-renewer
    namespace: ilb-hcp-pip-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: example-tenant-a-ilb-update-credential
  namespace: cilium-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [example-tenant-a-k8sbackend-auth]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-tenant-a-ilb-update-credential
  namespace: cilium-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: example-tenant-a-ilb-update-credential
subjects:
  - kind: ServiceAccount
    name: example-tenant-a-ilb-credential-renewer
    namespace: ilb-hcp-pip-controller
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: example-tenant-a-ilb-credential-renew
  namespace: ilb-hcp-pip-controller
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: example-tenant-a-ilb-credential-renewer
          restartPolicy: Never
          containers:
            - name: renew
              image: registry.example.com:5000/openshift4/ose-tools-rhel9@sha256:5b0e849193d864cecf0dfb2c4cea5dca9ee86847a07c228687b5952a5698cbac
              command: [python3, /opt/renew/rotate_remote_credential.py]
              volumeMounts:
                - {name: source, mountPath: /opt/renew, readOnly: true}
                - {name: private-tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          volumes:
            - name: source
              configMap: {name: example-tenant-a-ilb-credential-renew-source, defaultMode: 292}
            - name: private-tmp
              emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: example-tenant-a-ilb-credential-renew
  namespace: openshift-monitoring
spec:
  groups:
    - name: example-tenant-a-ilb-credential
      rules:
        - alert: TenantAILBCredentialRenewalFailed
          expr: kube_job_status_failed{namespace="ilb-hcp-pip-controller",job_name=~"example-tenant-a-ilb-credential-renew-.*"} > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: example-tenant-a ILB credential renewal Job failed
        - alert: TenantAILBCredentialRenewalStale
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"} > 1800)
            and on(namespace,cronjob)
            (kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"} == 0)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: example-tenant-a ILB credential renewal last success is stale
        - alert: TenantAILBCredentialRenewalNeverSucceeded
          expr: >-
            (kube_cronjob_info{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}
            unless on(namespace,cronjob)
            kube_cronjob_status_last_successful_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"})
            and on(namespace,cronjob)
            (kube_cronjob_status_last_schedule_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"} > 0)
            and on(namespace,cronjob)
            (kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"} == 0)
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: example-tenant-a ILB credential renewal has never succeeded after scheduling
        - alert: TenantAILBCredentialRenewalSuspended
          expr: kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"} == 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: example-tenant-a ILB credential renewal is suspended
        - alert: TenantAILBCredentialRenewalMissing
          expr: >-
            absent(kube_cronjob_info{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"})
            and on()
            (max(up{namespace="openshift-monitoring",job="kube-state-metrics",endpoint="https-main"}) == 1)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: example-tenant-a ILB credential renewal CronJob is absent while kube-state-metrics is healthy
