apiVersion: v1
kind: Namespace
metadata:
  name: ilb-poc
  labels:
    poc.isovalent.com/ilb-hcp-pip: example-tenant-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ilb-hcp-pip-remote
  namespace: ilb-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ilb-hcp-pip-remote-read
rules:
  - apiGroups: [""]
    resources: ["services", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ilb-hcp-pip-remote-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ilb-hcp-pip-remote-read
subjects:
  - kind: ServiceAccount
    name: ilb-hcp-pip-remote
    namespace: ilb-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ilb-hcp-pip-remote-service-write
  namespace: ilb-poc
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["echo"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["services/status"]
    resourceNames: ["echo"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ilb-hcp-pip-remote-service-write
  namespace: ilb-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ilb-hcp-pip-remote-service-write
subjects:
  - kind: ServiceAccount
    name: ilb-hcp-pip-remote
    namespace: ilb-poc
