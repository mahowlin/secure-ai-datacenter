kind: HCPRuntimeSecretHandoff
metadata:
  name: example-management
spec:
  owner: saif-sys-admin
  timing: after-target-namespace-before-hostedcluster-sync
  sourceNamespaceByRole:
    multus: clusters-example-shared
  secrets:
    pull-secret:
      type: kubernetes.io/dockerconfigjson
      keys: [.dockerconfigjson]
    ssh-key:
      type: Opaque
      keys: [id_rsa.pub]
