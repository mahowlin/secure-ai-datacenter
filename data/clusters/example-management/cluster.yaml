kind: OCPCluster

metadata:
  name: example-management
  description: Compact OpenShift management cluster for hosted control planes.

spec:
  releaseRef: saif-ocp-4.19-cilium-1.19
  currentReleaseRef: saif-ocp-4.19-cilium-1.19
  targetReleaseRef: saif-ocp-4.19-cilium-1.19
  mode: compact
  features:
    hostedControlPlanes: true
    KubeVirt: true

  # Day 1: renders install-config.yaml.
  installConfig:
    openshift:
      registryTrustPolicy: additional-ca
      imageDelivery:
        mode: mirrored
        scopes: [ocp-install-core, cilium-day1, gitops-bootstrap, platform-day2]
      baseDomain: example.com
      networkCatalog: example-federal
      networkType: Cilium

    networking:
      machineNetwork: Management
      apiVIP: 198.18.1.73
      ingressVIP: 198.18.1.74

    cilium:
      securityContext:
        privileged: true
      routingMode: tunnel
      tunnelProtocol: vxlan
      tunnelPort: 4789
      autoDirectNodeRoutes: false
      kubeProxyReplacement: true
      socketLB:
        hostNamespaceOnly: true
      bpf:
        masquerade: true
      cni:
        binPath: /var/lib/cni/bin
        confPath: /var/run/multus/cni/net.d
        exclusive: false
      clusterHealthPort: 9940
      operator:
        replicas: 2
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      hubble:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    capabilities:
      disconnectedCatalogs: true

  # Day 1: renders agent-config.yaml.
  agentConfig:
    inventoryMode: declared
    rendezvousNode: example-node-2
    managementInterface:
      bond: bond0
      members: [eth0, eth1]
      mode: active-backup
      options: {miimon: "100", primary: eth0}

    nodes:
      - name: example-node-2
        ip: 198.18.1.70
        serial: EXAMPLE97GMG
        interfaces:
        - name: eth0
          macAddress: 02:00:5e:00:54:00
        - name: eth1
          macAddress: 02:00:5e:00:54:01
        rootDeviceHints:
          serialNumber: EXAMPLE-MGMT-BOOT-0001

      - name: example-node-3
        ip: 198.18.1.71
        serial: EXAMPLE17B3L
        interfaces:
        - name: eth0
          macAddress: 02:00:5e:00:54:02
        - name: eth1
          macAddress: 02:00:5e:00:54:03
        rootDeviceHints:
          serialNumber: EXAMPLE-MGMT-BOOT-0002

      - name: example-node-4
        ip: 198.18.1.72
        serial: EXAMPLE370W3
        interfaces:
        - name: eth0
          macAddress: 02:00:5e:00:54:04
        - name: eth1
          macAddress: 02:00:5e:00:54:05
        rootDeviceHints:
          serialNumber: EXAMPLE-MGMT-BOOT-0003

  # Day 0/UCS: physical vNIC inventory and VLAN allowance.
  ucs:
    profileNameTemplate: "saif-{node.name}"
    hostNetworking:
      managementVNICPair:
        names: [eth0, eth1]
        nativeNetworkRef: Management

      tenantVNICPair:
        enabled: true
        names: [eth2, eth3]
        taggedNetworks:
          - tenant-b-kube-api-peering
          - tenant-b-workers

  # Day 2: GitOps-owned parent/HCP networking and hosted cluster creation.
  day2GitOps:
    # Retained live hosted cluster outside this rendered lifecycle. Keep its
    # address claims while successors coexist; never allocate over them.
    retainedHostedNetworkClaims:
      example-tenant-a:
        clusterNetwork: [10.196.0.0/14]
        serviceNetwork: [172.20.0.0/16]
      example-shared:
        clusterNetwork: [10.200.0.0/14]
        serviceNetwork: [172.21.0.0/16]
    hostedClusterLifecycle:
      phase: workers
      gitopsBootstrap: true
      managementPodCapacity:
        machineConfigPool: master
        maxPods: 400
        podsPerCore: 0
        restartPolicy:
          path: /etc/kubernetes/kubelet.conf
          serviceName: kubelet.service
      deploymentSubjects:
        multus: example-multus-a
        stagedOnly: [example-shared]
      workerPlacement:
        eligibleManagementNodes:
          - example-node-2.example.com
          - example-node-3.example.com
          - example-node-4.example.com
        spreadWeight: 100
      workerReplicas: 5
      workerReplicasByCluster:
        example-shared: 3
        example-multus-a: 5
    maintenanceVmHolds: []
    observability:
      managementExporter:
        connectionLogMaxLineBytes: 16777216
        expectedProducerWriterMaxSizeMiB: 16
        requestConcurrency: 1
        args: [--config-dir, /etc/vector/, --threads, '1']
        memoryRequestMiB: 512
        memoryLimitMiB: 1024
        cpuLimitMillicores: 1000
        profile:
          baselineContainerMiB: 434
          processBaselineBytes: 65990656
          processPeakBytes: 466526208
          headroomPercent: 25
          cpuMillicores: 1000
          threads: 1
          maxLineBytes: 16777216
          diskRecordMaxBytes: 134217728
          requestConcurrency: 1
          evidence: docs/example-profile-status.md#management-exporter
      nativeMonitoringPolicyRef: data/clusters/example-management/native-monitoring.yaml
      centralTimescape:
        enabled: true
        storageClass: px-csi-replicated-default
        retainedHostedClusters: [example-tenant-a]
        writerReview:
          managementApiEndpoint: https://api.example-management.example.com:6443
          guestControllerRef: sealed-secrets/sealed-secrets-controller
          commandTimeoutSeconds: 30
          jobTimeoutMinutes: 10
        foundation:
          serviceMonitors: [server, ingester, clickhouse]
          alertRules: [ingester, clickhouse]
    storage:
      profile: portworx-local
      activation: provider-cutover
      maturity: partial
      version: 3.7.0
      operatorVersion: 26.3.2
      storkVersion: 26.4.1
      storageClass: px-rwx-block-kubevirt
      licenseSecretName: px-enterprise-license
      nodes:
        # Historical UCS inventory, required to be revalidated at the live
        # maintenance gate. Disk 0 is dedicated PX-StoreV2 metadata/internal
        # KVDB; the remaining four are data devices. Boot media is separate.
        - name: example-node-2
          systemMetadataDevice: /dev/disk/by-id/nvme-EXAMPLE-01
          devices:
            - /dev/disk/by-id/nvme-EXAMPLE-02
            - /dev/disk/by-id/nvme-EXAMPLE-03
            - /dev/disk/by-id/nvme-EXAMPLE-04
            - /dev/disk/by-id/nvme-EXAMPLE-05
        - name: example-node-3
          systemMetadataDevice: /dev/disk/by-id/nvme-EXAMPLE-06
          devices:
            - /dev/disk/by-id/nvme-EXAMPLE-07
            - /dev/disk/by-id/nvme-EXAMPLE-08
            - /dev/disk/by-id/nvme-EXAMPLE-09
            - /dev/disk/by-id/nvme-EXAMPLE-10
        - name: example-node-4
          systemMetadataDevice: /dev/disk/by-id/nvme-EXAMPLE-11
          devices:
            - /dev/disk/by-id/nvme-EXAMPLE-12
            - /dev/disk/by-id/nvme-EXAMPLE-13
            - /dev/disk/by-id/nvme-EXAMPLE-14
            - /dev/disk/by-id/nvme-EXAMPLE-15

      # The only HCP worker NodePool. The suffix is the live object name.
      # activation is kept because that annotation is already on example-shared.
      hcpNodePool:
        activation: staged
        suffix: workers-rwx
        upgradeType: InPlace
        maxUnavailable: 1
        autoRepair: false
        accessModes: [ReadWriteMany]
        volumeMode: Block

    addOns:
      # Optional GPU/NVIDIA stack. Disabled for the HCP baseline to keep app
      # health validation focused on the hosted-control-plane path.
      nvidia: false
      # Optional external observability integrations: Splunk and Intersight.
      # Hubble/Timescape remains part of the Isovalent baseline when Cilium is used.
      splunk: false
      # Optional demo workloads such as OpenWebUI and DeepSeek/NIM.
      # These require nvidia=true when enabled.
      demoApps: false
      # Optional SAIF agent demo. Requires demoApps, NVIDIA/LLM backend,
      # and Cilium/Hubble/Timescape flow data.
      saifDemo: false

    inClusterLoadBalancer:
      enabled: true
      lifecycle: staged
      routerReplicas: 2
      ciliumConfigProfileRef: iep-1.19.5-openshift-ilb
      placement:
        routerAndT1Nodes: [example-node-2, example-node-3]
        t2Nodes: [example-node-4]
        jobImage: registry.example.com:5000/openshift4/ose-tools-rhel9@sha256:5b0e849193d864cecf0dfb2c4cea5dca9ee86847a07c228687b5952a5698cbac
    ciliumConfig:
      gatewayAPI:
        enabled: false
    parentNetworking:
      tenantInterface:
        bond: bond1
        members: [eth2, eth3]

      peeringNetworks:
        - networkRef: tenant-b-kube-api-peering
          purpose: hostedClusterApi
          parentNodePeeringIPs:
            example-node-2: 198.18.13.10
            example-node-3: 198.18.13.11
            example-node-4: 198.18.13.12

        - networkRef: tenant-b-workers
          purpose: hostedClusterWorkers

      managementLoadBalancerPool:
        name: example-management-management-lb-pool
        start: 198.18.1.90
        stop: 198.18.1.99
        serviceSelector:
          matchLabels:
            saif.example.com/service-exposure: management-admin
          matchExpressions:
            - key: saif.example.com/control-plane-ingress
              operator: DoesNotExist
