# Canonical example-management distribution registry.
# Values are factual inventory or explicit policy. The renderer does not invent them.
# Secret values are not here. Service ClusterIPs are not here.
apiVersion: saif.example.com/v1alpha1
kind: LocalRegistry
metadata:
  name: example-management
spec:
  # Safe default: consumers use the preceding site registry; no cache bootstrap cycle.
  cacheProduction:
    mode: preceding-registry
  namespace: hcp-image-cache
  pullService: hcp-registry-pull
  syncService: hcp-registry-sync
  port: 5000
  workloadName: hcp-distribution-registry
  listeners: {distribution: 5000, pull: 8080, sync: 8081}
  # Declared example frontend, not a live address reservation or runtime credential.
  externalPull:
    enabled: true
    name: example-hcp-registry
    networkRef: tenant-b-kube-api-peering
    poolRef: tenant-b-hcp-management-services
    vip: 198.18.13.20
    allocationEvidence: Synthetic example only; reserve and verify the site address
      before apply
    hostnamePrefix: images
    servicePort: 443
    listenerPort: 8443
    externalTrafficPolicy: Cluster
    tlsSecret: example-hcp-registry-tls
    runtimeOwner: site-registry-and-trust-pipeline
    pullClientSecret:
      namespace: hcp-image-cache
      name: hcp-registry-pull-client
    consumer:
      workerAttachmentKinds:
      - multus-l2
      deploymentSubjectRoles:
      - multus
      pullSecret: example-hcp-registry-pull
      trustBundle: example-hcp-registry-ca
      exporterImagePull: hosted-mirror
  pvc:
    name: hcp-distribution-storage
    size: 100Gi
    storageClass: px-csi-replicated-default
  images:
    distribution: registry.example.com:5000/library/registry@sha256:46faa9a1ae6813194b53921a370f2f4f8c5e1aae228a89bceafef5847a6a3278
    accessProxy: registry.example.com:5000/nginxinc/nginx-unprivileged@sha256:31effa6a4e07670f7a7602293a7fc73a49b7622a078e5c69ea5c14e548dbe2f0
  # Synthetic UID example. Replace with the actual namespace/SCC allocation before deployment.
  podUid: 1000000000
  resources:
    distribution:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "2", memory: 1Gi}
    accessProxy:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: "1", memory: 256Mi}
  emptyDir:
    distributionTmp: 64Mi
    proxyTmp: 64Mi
    proxyCache: 256Mi
  runtimeSecrets:
    http: hcp-distribution-http-secret
    pullAuth: hcp-registry-pull-auth
    syncAuth: hcp-registry-sync-auth
    pullTls: hcp-registry-pull-tls
    syncTls: hcp-registry-sync-tls
  consumer:
    managementReleaseMode: site-recovery
  mirrors:
    - source: quay.io/openshift-release-dev/ocp-release
      repository: hcp-image-cache/r-1730a2489901a321bfe4e98de75a6a1c745546a487a75426
