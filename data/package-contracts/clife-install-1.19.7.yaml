                const: true
              serviceMonitor:
                type: object
                additionalProperties: false
                required:
                - enabled
                properties:
                  enabled:
                    const: true
          hubble:
            type: object
            additionalProperties: false
            required:
            - enabled
            - tls
            - timescape
            - export
            - connectionLog
            properties:
              enabled:
                const: true
              tls:
                type: object
                additionalProperties: false
                required:
                - enabled
                properties:
                  enabled:
                    const: true
              timescape:
                type: object
                additionalProperties: false
                required:
                - enabled
                properties:
                  enabled:
                    const: true
              export:
                type: object
                additionalProperties: false
                required:
                - static
