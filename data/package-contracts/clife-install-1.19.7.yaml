          kubeProxyReplacement:
            const: true
          clusterHealthPort:
            const: 9940
          tunnelPort:
            const: 4788
          enterprise:
            type: object
            additionalProperties: false
            required:
            - featureGate
            - bgpControlPlane
            - bfd
            properties:
              featureGate:
                type: object
                additionalProperties: false
                required:
                - approved
                properties:
                  approved:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
              bgpControlPlane:
                type: object
                additionalProperties: false
                required:
                - enabled
                - routeImport
                properties:
                  enabled:
                    const: true
                  routeImport:
                    type: object
                    additionalProperties: false
                    required:
                    - enabled
                    properties:
                      enabled:
                        const: true
              bfd:
                type: object
                additionalProperties: false
                required:
                - enabled
                properties:
                  enabled:
                    const: true
              egressGatewayHA:
                type: object
                additionalProperties: false
                required:
                - enabled
                properties:
                  enabled:
                    const: true
          k8sServiceHost:
            type: string
            minLength: 1
          k8sServicePort:
            const: 443
          routingMode:
            const: tunnel
          tunnelProtocol:
            const: vxlan
          bpf:
            type: object
            additionalProperties: false
            required:
            - masquerade
