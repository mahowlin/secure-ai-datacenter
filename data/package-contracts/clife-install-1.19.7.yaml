                    minItems: 1
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                  clusterPoolIPv4MaskSize:
                    type: integer
                    minimum: 1
                    maximum: 32
          cni:
            type: object
            additionalProperties: false
            required:
            - binPath
            - confPath
            - exclusive
            properties:
              binPath:
                const: /var/lib/cni/bin
              confPath:
                const: /var/run/multus/cni/net.d
              exclusive:
                const: false
          prometheus:
