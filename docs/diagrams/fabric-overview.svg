<svg xmlns="http://www.w3.org/2000/svg" width="800" height="684" viewBox="0 0 800 684" role="img" aria-labelledby="title description">
<title id="title">ACI configuration and server connectivity</title>
<desc id="description">ACI configuration and server connectivity. Conceptual example; configuration detail is linked from the owning README.</desc>
<defs>
<marker id="arrow-delivery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6C84"/></marker>
<marker id="arrow-protocol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00875A"/></marker>
<marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A5AF8"/></marker>
<marker id="arrow-supply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D96C00"/></marker>
<marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147D92"/></marker>
<marker id="arrow-trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C93756"/></marker>
<style>
.heading{font:700 30px system-ui,-apple-system,sans-serif;fill:#172B4D}
.subheading{font:500 17px system-ui,-apple-system,sans-serif;fill:#5E6C84}
.zone-title{font:700 18px system-ui,-apple-system,sans-serif;fill:#42526E}
.zone-note{font:500 14px system-ui,-apple-system,sans-serif;fill:#6B778C}
.node-title{font:700 18px system-ui,-apple-system,sans-serif;fill:#172B4D}
.node-line{font:500 15px system-ui,-apple-system,sans-serif;fill:#344563}
.edge-label{font:600 18px system-ui,-apple-system,sans-serif;fill:#344563}
.badge{font:700 11.5px system-ui,-apple-system,sans-serif;fill:#5E6C84}
.legend{font:600 12.5px system-ui,-apple-system,sans-serif;fill:#344563}
</style>
</defs>
<rect width="800" height="684" fill="#F7F9FC"/>


<g id="zone-aci">
<rect x="20" y="258" width="760" height="288" rx="18" fill="#FFFFFF" fill-opacity="0.25" stroke="#C7D1E0" stroke-width="1.5"/>
</g>
<g id="connections">
<path d="M 350 52 L 450 52" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-delivery)"/>
<path d="M 615 88 L 615 148" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-delivery)"/>
<path d="M 615 220 L 615 260 L 400 260 L 400 300" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-delivery)"/>
<path d="M 270 372 L 270 412 L 205 412 L 205 456" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 530 372 L 530 412 L 595 412 L 595 456" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 205 528 L 205 560 L 270 560 L 270 588" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 595 528 L 595 560 L 530 560 L 530 588" fill="none" stroke="#5E6C84" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g id="zone-labels">
<g id="zone-label-aci">
<rect x="32" y="267" width="188.79999999999998" height="33" rx="6" fill="#FFFFFF" fill-opacity="0.97"/>
<text x="40" y="289" class="zone-title" style="font-size:18.0px" text-anchor="start">Cisco ACI fabric</text>
</g>
</g>
<g id="nodes">
<g id="yaml">
<rect x="20" y="16" width="330" height="72" rx="14" fill="#E8F2FF" stroke="#7A869A" stroke-width="1.6"/>
<text x="36" y="45" class="node-title" style="font-size:18.0px" text-anchor="start">Network configuration</text>
<text x="36" y="71" class="node-line" style="font-size:18.0px" text-anchor="start">Management + access + tenants</text>
</g>
<g id="terraform">
<rect x="450" y="16" width="330" height="72" rx="14" fill="#F1F3F5" stroke="#7A869A" stroke-width="1.6"/>
<text x="466" y="45" class="node-title" style="font-size:18.0px" text-anchor="start">Terraform / NAC-ACI</text>
<text x="466" y="71" class="node-line" style="font-size:18.0px" text-anchor="start">Validate + plan + apply</text>
</g>
<g id="apic">
<rect x="450" y="148" width="330" height="72" rx="14" fill="#E6F4FC" stroke="#7A869A" stroke-width="1.6"/>
<text x="466" y="177" class="node-title" style="font-size:18.0px" text-anchor="start">Cisco APIC</text>
<text x="466" y="203" class="node-line" style="font-size:18.0px" text-anchor="start">Realizes reviewed network policy</text>
</g>
<g id="leaves">
<rect x="160" y="300" width="480" height="72" rx="14" fill="#E6F4FC" stroke="#7A869A" stroke-width="1.6"/>
<text x="176" y="329" class="node-title" style="font-size:18.0px" text-anchor="start">ACI leaf switches</text>
<text x="176" y="355" class="node-line" style="font-size:18.0px" text-anchor="start">Server attachments + tenant routing</text>
</g>
<g id="management">
<rect x="40" y="456" width="330" height="72" rx="14" fill="#E6F4FC" stroke="#7A869A" stroke-width="1.6"/>
<text x="56" y="485" class="node-title" style="font-size:18.0px" text-anchor="start">Management attachment</text>
<text x="56" y="511" class="node-line" style="font-size:18.0px" text-anchor="start">Management VLAN + gateway</text>
</g>
<g id="tenant">
<rect x="430" y="456" width="330" height="72" rx="14" fill="#E6F4FC" stroke="#7A869A" stroke-width="1.6"/>
<text x="446" y="485" class="node-title" style="font-size:18.0px" text-anchor="start">Tenant attachment</text>
<text x="446" y="511" class="node-line" style="font-size:18.0px" text-anchor="start">Trunk VLANs + BGP peering</text>
</g>
<g id="servers">
<rect x="160" y="588" width="480" height="72" rx="14" fill="#FFF0EF" stroke="#7A869A" stroke-width="1.6"/>
<text x="176" y="617" class="node-title" style="font-size:18.0px" text-anchor="start">UCS / OpenShift servers</text>
<text x="176" y="643" class="node-line" style="font-size:18.0px" text-anchor="start">Host networking configured by Compute / GitOps</text>
</g>
</g>
<g id="connection-labels">
</g>
</svg>
