<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img" aria-labelledby="title description">
<title id="title">Worker bootstrap and control-plane communication</title>
<desc id="description">Before registration, a worker needs a routed service path to Ignition, the hosted Kubernetes API, DNS, NTP, and the container registry. After bootstrap, the Konnectivity agent opens an outbound mTLS channel to the hosted server. Control-plane clients then use that existing channel for logical requests to the worker.</desc>
<defs>
<marker id="arrow-delivery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6FFF"/></marker>
<marker id="arrow-protocol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00875A"/></marker>
<marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A5AF8"/></marker>
<marker id="arrow-supply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D96C00"/></marker>
<marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147D92"/></marker>
<marker id="arrow-trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C93756"/></marker>
<style>
.heading{font:700 30px system-ui,-apple-system,sans-serif;fill:#172B4D}
.subheading{font:500 17px system-ui,-apple-system,sans-serif;fill:#5E6C84}
.zone-title{font:700 18px system-ui,-apple-system,sans-serif;fill:#42526E}
.zone-note{font:500 14px system-ui,-apple-system,sans-serif;fill:#6B778C}
.node-title{font:700 18px system-ui,-apple-system,sans-serif;fill:#172B4D}
.node-line{font:500 15px system-ui,-apple-system,sans-serif;fill:#344563}
.edge-label{font:650 12.5px system-ui,-apple-system,sans-serif;fill:#344563}
.badge{font:700 11.5px system-ui,-apple-system,sans-serif;fill:#5E6C84}
.legend{font:600 12.5px system-ui,-apple-system,sans-serif;fill:#344563}
</style>
</defs>
<rect width="920" height="590" fill="#F7F9FC"/>
<text x="36" y="46" class="heading" text-anchor="start">Worker bootstrap and control-plane communication</text>
<text x="36" y="78" class="subheading" text-anchor="start">Bootstrap dependencies must work first; Konnectivity carries later requests over a worker-established channel.</text>
<g id="zone-bootstrap">
<rect x="20" y="105" width="880" height="255" rx="18" fill="#F2ECFF" fill-opacity="0.72" stroke="#8B6BD9" stroke-width="1.5" stroke-dasharray="8 6"/>
</g>
<g id="zone-established">
<rect x="20" y="390" width="880" height="160" rx="18" fill="#E8F2FF" fill-opacity="0.72" stroke="#5B8DEF" stroke-width="1.5" stroke-dasharray="8 6"/>
</g>
<g id="connections">
<path d="M 220 217 L 300 217" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 490 195 L 555 195 L 555 162 L 640 162" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 490 245 L 555 245 L 555 282 L 640 282" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 265 460 L 355 460" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 655 495 L 565 495" fill="none" stroke="#7A5AF8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-api)"/>
<path d="M 355 495 L 265 495" fill="none" stroke="#7A5AF8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-api)"/>
</g>
<g id="zone-labels">
<g id="zone-label-bootstrap">
<rect x="32" y="114" width="275.2" height="33" rx="6" fill="#FFFFFF" fill-opacity="0.97"/>
<text x="40" y="136" class="zone-title" style="font-size:18.0px" text-anchor="start">Before Node registration</text>
</g>
<g id="zone-label-established">
<rect x="32" y="399" width="415.59999999999997" height="33" rx="6" fill="#FFFFFF" fill-opacity="0.97"/>
<text x="40" y="421" class="zone-title" style="font-size:18.0px" text-anchor="start">After bootstrap and Node registration</text>
</g>
</g>
<g id="nodes">
<g id="worker-boot">
<rect x="45" y="160" width="175" height="115" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="61" y="189" class="node-title" style="font-size:17.0px" text-anchor="start">Booting worker</text>
<text x="61" y="215" class="node-line" style="font-size:15.0px" text-anchor="start">worker network IP</text>
<text x="61" y="238" class="node-line" style="font-size:14.2px" text-anchor="start">not registered yet</text>
<text x="61" y="261" class="node-line" style="font-size:13.4px" text-anchor="start">no Konnectivity yet</text>
</g>
<g id="service-edge">
<rect x="300" y="150" width="190" height="135" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="316" y="179" class="node-title" style="font-size:13.5px" text-anchor="start">Provider service path</text>
<text x="316" y="205" class="node-line" style="font-size:14.1px" text-anchor="start">worker network route</text>
<text x="316" y="228" class="node-line" style="font-size:15.0px" text-anchor="start">provider endpoints</text>
<text x="316" y="251" class="node-line" style="font-size:15.0px" text-anchor="start">external routing</text>
</g>
<g id="hosted-services">
<rect x="640" y="115" width="240" height="95" rx="14" fill="#E8F2FF" stroke="#7A869A" stroke-width="1.6"/>
<text x="656" y="144" class="node-title" style="font-size:18.0px" text-anchor="start">Hosted endpoints</text>
<text x="656" y="170" class="node-line" style="font-size:15.0px" text-anchor="start">Ignition</text>
<text x="656" y="193" class="node-line" style="font-size:15.0px" text-anchor="start">Kubernetes API</text>
</g>
<g id="external-services">
<rect x="640" y="235" width="240" height="95" rx="14" fill="#F1F3F5" stroke="#7A869A" stroke-width="1.6"/>
<text x="656" y="264" class="node-title" style="font-size:16.5px" text-anchor="start">External dependencies</text>
<text x="656" y="290" class="node-line" style="font-size:15.0px" text-anchor="start">DNS · NTP</text>
<text x="656" y="313" class="node-line" style="font-size:15.0px" text-anchor="start">container registry</text>
</g>
<g id="worker-agent">
<rect x="55" y="425" width="210" height="100" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="71" y="454" class="node-title" style="font-size:18.0px" text-anchor="start">Ready worker</text>
<text x="71" y="480" class="node-line" style="font-size:15.0px" text-anchor="start">Konnectivity agent</text>
<text x="71" y="503" class="node-line" style="font-size:15.0px" text-anchor="start">initiates the channel</text>
</g>
<g id="konnectivity">
<rect x="355" y="425" width="210" height="100" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="371" y="454" class="node-title" style="font-size:15.6px" text-anchor="start">Konnectivity server</text>
<text x="371" y="480" class="node-line" style="font-size:15.0px" text-anchor="start">accepts outbound mTLS</text>
<text x="371" y="503" class="node-line" style="font-size:15.0px" text-anchor="start">relays later requests</text>
</g>
<g id="control-client">
<rect x="655" y="425" width="210" height="100" rx="14" fill="#E8F2FF" stroke="#7A869A" stroke-width="1.6"/>
<text x="671" y="454" class="node-title" style="font-size:14.8px" text-anchor="start">Control-plane client</text>
<text x="671" y="480" class="node-line" style="font-size:15.0px" text-anchor="start">uses existing channel</text>
<text x="671" y="503" class="node-line" style="font-size:11.8px" text-anchor="start">never dials worker directly</text>
</g>
</g>
<g id="connection-labels">
<rect x="549.0" y="138.0" width="94.0" height="18.0" rx="5" fill="#FFFFFF" fill-opacity="0.97" stroke="#D8DEE8" stroke-width="0.8"/>
<text x="596" y="154" class="edge-label" style="font-size:10.0px" text-anchor="middle">Ignition + API</text>
<rect x="539.7" y="258.5" width="112.6" height="17.5" rx="5" fill="#FFFFFF" fill-opacity="0.97" stroke="#D8DEE8" stroke-width="0.8"/>
<text x="596" y="274" class="edge-label" style="font-size:9.5px" text-anchor="middle">DNS · NTP · images</text>
<rect x="266.0" y="436.0" width="88.0" height="18.0" rx="5" fill="#FFFFFF" fill-opacity="0.97" stroke="#D8DEE8" stroke-width="0.8"/>
<text x="310" y="452" class="edge-label" style="font-size:10.0px" text-anchor="middle">outbound mTLS</text>
<rect x="560.0" y="471.0" width="100.0" height="18.0" rx="5" fill="#FFFFFF" fill-opacity="0.97" stroke="#D8DEE8" stroke-width="0.8"/>
<text x="610" y="487" class="edge-label" style="font-size:10.0px" text-anchor="middle">logical request</text>
</g>
<line x1="40" y1="551" x2="76" y2="551" stroke="#00875A" stroke-width="3" stroke-dasharray="10 6"/>
<text x="86" y="556" class="legend" style="font-size:12.5px" text-anchor="start">network protocol / transport</text>
<line x1="320.0" y1="551" x2="356.0" y2="551" stroke="#7A5AF8" stroke-width="3"/>
<text x="366.0" y="556" class="legend" style="font-size:12.5px" text-anchor="start">API / controller contract</text>
</svg>
