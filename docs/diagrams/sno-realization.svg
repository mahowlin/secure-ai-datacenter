<text x="576" y="194" class="node-title" style="font-size:18.0px" text-anchor="start">UCS vNIC identity</text>
<text x="577" y="220" class="node-line" style="font-size:14.9px" text-anchor="start">•</text>
<text x="596" y="220" class="node-line" style="font-size:14.9px" text-anchor="start">selected server profile</text>
<text x="577" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="596" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">vNICs eth0 + eth1</text>
<text x="577" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="596" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">VLAN 2101 allowed</text>
</g>
<g id="inputs">
<rect x="820" y="165" width="235" height="155" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
