<text x="856" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">install-config.yaml</text>
<text x="837" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="856" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">AgentConfig bond0</text>
<text x="837" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="856" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">metadata + manifests</text>
</g>
<g id="iso">
