<text x="87" y="880" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="106" y="880" class="node-line" style="font-size:15.0px" text-anchor="start">DNS and NTP</text>
<text x="87" y="903" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="106" y="903" class="node-line" style="font-size:15.0px" text-anchor="start">configured registry</text>
<text x="87" y="926" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="106" y="926" class="node-line" style="font-size:15.0px" text-anchor="start">release images and catalogs</text>
