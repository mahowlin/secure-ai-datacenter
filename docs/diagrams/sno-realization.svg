<text x="407" y="525" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="426" y="525" class="node-line" style="font-size:15.0px" text-anchor="start">upload to the file server</text>
<text x="407" y="548" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="426" y="548" class="node-line" style="font-size:15.0px" text-anchor="start">Intersight vMedia policy</text>
<text x="407" y="571" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="426" y="571" class="node-line" style="font-size:15.0px" text-anchor="start">ISO mounted as boot media</text>
</g>
<g id="metal">
