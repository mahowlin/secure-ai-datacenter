<text x="51" y="499" class="node-title" style="font-size:18.0px" text-anchor="start">Agent ISO generation</text>
<text x="52" y="525" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="71" y="525" class="node-line" style="font-size:15.0px" text-anchor="start">install-config + AgentConfig</text>
<text x="52" y="548" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="71" y="548" class="node-line" style="font-size:15.0px" text-anchor="start">runtime secrets + hardware facts</text>
<text x="52" y="571" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="71" y="571" class="node-line" style="font-size:15.0px" text-anchor="start">Day 1 + image-policy manifests</text>
<text x="52" y="594" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="71" y="594" class="node-line" style="font-size:15.0px" text-anchor="start">openshift-install build command</text>
<text x="52" y="617" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="71" y="617" class="node-line" style="font-size:15.0px" text-anchor="start">output: Agent ISO</text>
</g>
