<text x="57" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="76" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">example-sno</text>
<text x="57" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="76" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">mode: sno</text>
<text x="57" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="76" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">one rendezvous node</text>
</g>
<g id="aci">
