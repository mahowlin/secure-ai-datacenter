<text x="761" y="499" class="node-title" style="font-size:18.0px" text-anchor="start">Selected bare-metal server</text>
<text x="762" y="525" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="781" y="525" class="node-line" style="font-size:15.0px" text-anchor="start">UCS profile attached</text>
<text x="762" y="548" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="781" y="548" class="node-line" style="font-size:15.0px" text-anchor="start">eth0 + eth1 become bond0</text>
<text x="762" y="571" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="781" y="571" class="node-line" style="font-size:15.0px" text-anchor="start">one-time boot from Agent ISO</text>
</g>
<g id="services">
