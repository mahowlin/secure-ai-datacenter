<text x="317" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="336" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">management network</text>
<text x="317" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="336" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">gateway 198.18.1.1</text>
<text x="317" y="266" class="node-line" style="font-size:14.9px" text-anchor="start">•</text>
<text x="336" y="266" class="node-line" style="font-size:14.9px" text-anchor="start">existing fabric attachment</text>
</g>
<g id="ucs">
