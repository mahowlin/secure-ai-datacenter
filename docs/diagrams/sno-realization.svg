<text x="656" y="854" class="node-title" style="font-size:18.0px" text-anchor="start">Single-node OpenShift</text>
<text x="657" y="880" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="676" y="880" class="node-line" style="font-size:15.0px" text-anchor="start">example-sno · 198.18.1.69</text>
<text x="657" y="903" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="676" y="903" class="node-line" style="font-size:15.0px" text-anchor="start">OVN-Kubernetes initially</text>
<text x="657" y="926" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="676" y="926" class="node-line" style="font-size:15.0px" text-anchor="start">Cilium Day-2 migration selected</text>
</g>
</g>
