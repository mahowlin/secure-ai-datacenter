<text x="76" y="810" class="node-line" style="font-size:16.0px" text-anchor="start">management pod network</text>
</g>
<g id="vm">
<rect x="510" y="755" width="330" height="66" rx="14" fill="#FFF0EF" stroke="#7A869A" stroke-width="1.6"/>
