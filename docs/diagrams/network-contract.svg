<text x="281" y="114" class="node-title" style="font-size:18.0px" text-anchor="start">Existing site network</text>
<text x="281" y="140" class="node-line" style="font-size:16.0px" text-anchor="start">DNS / NTP / registry / client routes</text>
</g>
<g id="mgmtleaf">
