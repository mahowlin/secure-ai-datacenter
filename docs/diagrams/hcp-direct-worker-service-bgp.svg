<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-labelledby="title description">
<title id="title">Direct application Service BGP</title>
<desc id="description">Guest Service and Cilium BGP objects advertise a Service VIP. A tenant client sends a request through ACI to an advertising guest worker and workload backend, whose reply returns through the worker and ACI.</desc>
<defs>
<marker id="arrow-delivery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6FFF"/></marker>
<marker id="arrow-protocol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00875A"/></marker>
<marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A5AF8"/></marker>
<marker id="arrow-supply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D96C00"/></marker>
<marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147D92"/></marker>
<marker id="arrow-trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C93756"/></marker>
<style>
.heading{font:700 30px system-ui,-apple-system,sans-serif;fill:#172B4D}
.subheading{font:500 17px system-ui,-apple-system,sans-serif;fill:#5E6C84}
.zone-title{font:700 18px system-ui,-apple-system,sans-serif;fill:#42526E}
.zone-note{font:500 14px system-ui,-apple-system,sans-serif;fill:#6B778C}
.node-title{font:700 18px system-ui,-apple-system,sans-serif;fill:#172B4D}
.node-line{font:500 15px system-ui,-apple-system,sans-serif;fill:#344563}
.edge-label{font:650 12.5px system-ui,-apple-system,sans-serif;fill:#344563}
.badge{font:700 11.5px system-ui,-apple-system,sans-serif;fill:#5E6C84}
.legend{font:600 12.5px system-ui,-apple-system,sans-serif;fill:#344563}
</style>
</defs>
<rect width="1240" height="740" fill="#F7F9FC"/>
<text x="36" y="46" class="heading" text-anchor="start">Direct application Service BGP</text>
<text x="36" y="78" class="subheading" text-anchor="start">The guest advertises the VIP; the application request and reply stay in the guest-worker and tenant-fabric path.</text>
<g id="zone-control">
<rect x="20" y="110" width="1200" height="255" rx="18" fill="#FFFFFF" fill-opacity="0.72" stroke="#C7D1E0" stroke-width="1.5" stroke-dasharray="8 6"/>
</g>
<g id="zone-application">
<rect x="20" y="440" width="1200" height="245" rx="18" fill="#FFFFFF" fill-opacity="0.72" stroke="#C7D1E0" stroke-width="1.5" stroke-dasharray="8 6"/>
</g>
<g id="connections">
<path d="M 280 247 L 330 247" fill="none" stroke="#7A5AF8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-api)"/>
<path d="M 565 247 L 615 247" fill="none" stroke="#7A5AF8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-api)"/>
<path d="M 875 247 L 925 247" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 162 320 L 162 405 L 745 405 L 745 490" fill="none" stroke="#7A5AF8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-api)"/>
<path d="M 1060 320 L 1060 420 L 835 420 L 835 490" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 280 545 L 330 545" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 565 545 L 615 545" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 875 545 L 925 545" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 925 615 L 875 615" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 615 615 L 565 615" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
<path d="M 330 615 L 280 615" fill="none" stroke="#00875A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-protocol)"/>
</g>
<g id="zone-labels">
<g id="zone-label-control">
<rect x="32" y="119" width="502.0" height="33" rx="6" fill="#FFFFFF" fill-opacity="0.97"/>
<text x="40" y="141" class="zone-title" style="font-size:18.0px" text-anchor="start">Service configuration and route advertisement</text>
</g>
<g id="zone-label-application">
<rect x="32" y="449" width="469.59999999999997" height="33" rx="6" fill="#FFFFFF" fill-opacity="0.97"/>
<text x="40" y="471" class="zone-title" style="font-size:18.0px" text-anchor="start">Request left to right; reply right to left</text>
</g>
</g>
<g id="nodes">
<g id="svc">
<rect x="45" y="175" width="235" height="145" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="61" y="204" class="node-title" style="font-size:18.0px" text-anchor="start">Guest Service</text>
<text x="61" y="230" class="node-line" style="font-size:15.0px" text-anchor="start">type: LoadBalancer</text>
<text x="61" y="253" class="node-line" style="font-size:15.0px" text-anchor="start">selects workload pods</text>
</g>
<g id="pool">
<rect x="330" y="175" width="235" height="145" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="346" y="204" class="node-title" style="font-size:18.0px" text-anchor="start">Guest LB-IPAM</text>
<text x="346" y="230" class="node-line" style="font-size:15.0px" text-anchor="start">tenant Service pool</text>
<text x="346" y="253" class="node-line" style="font-size:15.0px" text-anchor="start">allocates the VIP /32</text>
</g>
<g id="policy">
<rect x="615" y="175" width="260" height="145" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="631" y="204" class="node-title" style="font-size:18.0px" text-anchor="start">Cilium BGP policy</text>
<text x="631" y="230" class="node-line" style="font-size:15.0px" text-anchor="start">selects the Service</text>
<text x="631" y="253" class="node-line" style="font-size:15.0px" text-anchor="start">selects peers + interfaces</text>
</g>
<g id="route">
<rect x="925" y="175" width="270" height="145" rx="14" fill="#F1F3F5" stroke="#7A869A" stroke-width="1.6"/>
<text x="941" y="204" class="node-title" style="font-size:18.0px" text-anchor="start">ACI route import</text>
<text x="941" y="230" class="node-line" style="font-size:15.0px" text-anchor="start">accept approved Service /32</text>
<text x="941" y="253" class="node-line" style="font-size:15.0px" text-anchor="start">install route in tenant VRF</text>
</g>
<g id="client">
<rect x="45" y="505" width="235" height="145" rx="14" fill="#F1F3F5" stroke="#7A869A" stroke-width="1.6"/>
<text x="61" y="534" class="node-title" style="font-size:18.0px" text-anchor="start">Tenant client</text>
<text x="61" y="560" class="node-line" style="font-size:15.0px" text-anchor="start">destination: Service VIP</text>
<text x="61" y="583" class="node-line" style="font-size:15.0px" text-anchor="start">receives backend reply</text>
</g>
<g id="aci">
<rect x="330" y="505" width="235" height="145" rx="14" fill="#F1F3F5" stroke="#7A869A" stroke-width="1.6"/>
<text x="346" y="534" class="node-title" style="font-size:18.0px" text-anchor="start">ACI tenant / VRF</text>
<text x="346" y="560" class="node-line" style="font-size:15.0px" text-anchor="start">route to advertised VIP</text>
<text x="346" y="583" class="node-line" style="font-size:15.0px" text-anchor="start">tenant return routing</text>
</g>
<g id="worker">
<rect x="615" y="490" width="260" height="175" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="631" y="519" class="node-title" style="font-size:15.8px" text-anchor="start">Advertising guest worker</text>
<text x="631" y="545" class="node-line" style="font-size:15.0px" text-anchor="start">Cilium owns Service VIP</text>
<text x="631" y="568" class="node-line" style="font-size:15.0px" text-anchor="start">selects workload backend</text>
<text x="631" y="591" class="node-line" style="font-size:15.0px" text-anchor="start">returns traffic to ACI</text>
</g>
<g id="backend">
<rect x="925" y="505" width="270" height="145" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="941" y="534" class="node-title" style="font-size:18.0px" text-anchor="start">Workload backend</text>
<text x="941" y="560" class="node-line" style="font-size:15.0px" text-anchor="start">selected guest pod</text>
<text x="941" y="583" class="node-line" style="font-size:15.0px" text-anchor="start">reply through its worker</text>
</g>
</g>
<g id="connection-labels">
<rect x="363.75" y="378.5" width="182.5" height="20.5" rx="5" fill="#FFFFFF" fill-opacity="0.97" stroke="#D8DEE8" stroke-width="0.8"/>
<text x="455" y="397" class="edge-label" style="font-size:12.5px" text-anchor="middle">Service + backend state</text>
<rect x="867.0" y="393.5" width="160.0" height="20.5" rx="5" fill="#FFFFFF" fill-opacity="0.97" stroke="#D8DEE8" stroke-width="0.8"/>
<text x="947" y="412" class="edge-label" style="font-size:12.5px" text-anchor="middle">route selects worker</text>
</g>
<line x1="40" y1="701" x2="76" y2="701" stroke="#7A5AF8" stroke-width="3"/>
<text x="86" y="706" class="legend" style="font-size:12.5px" text-anchor="start">API / controller contract</text>
<line x1="297.5" y1="701" x2="333.5" y2="701" stroke="#00875A" stroke-width="3" stroke-dasharray="10 6"/>
<text x="343.5" y="706" class="legend" style="font-size:12.5px" text-anchor="start">network protocol / transport</text>
</svg>
