<g id="nodes">
<g id="repo">
<rect x="70" y="165" width="360" height="155" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="86" y="194" class="node-title" style="font-size:18.0px" text-anchor="start">secure-ai-gitops</text>
<text x="87" y="220" class="node-line" style="font-size:14.9px" text-anchor="start">•</text>
<text x="106" y="220" class="node-line" style="font-size:14.9px" text-anchor="start">clusters/example-management entrypoints</text>
<text x="87" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="106" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">operators, network + lifecycle paths</text>
<text x="87" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="106" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">guest application paths</text>
</g>
<g id="argo">
<rect x="770" y="165" width="360" height="155" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="786" y="194" class="node-title" style="font-size:17.6px" text-anchor="start">Argo CD on management OpenShift</text>
<text x="787" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="806" y="220" class="node-line" style="font-size:15.0px" text-anchor="start">pulls desired state from Git</text>
<text x="787" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="806" y="243" class="node-line" style="font-size:15.0px" text-anchor="start">sync waves order Applications</text>
<text x="787" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="806" y="266" class="node-line" style="font-size:15.0px" text-anchor="start">local and named remote targets</text>
</g>
<g id="management-api">
<rect x="410" y="425" width="380" height="165" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="426" y="454" class="node-title" style="font-size:18.0px" text-anchor="start">Management Kubernetes API</text>
<text x="427" y="480" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="446" y="480" class="node-line" style="font-size:15.0px" text-anchor="start">server: kubernetes.default.svc</text>
<text x="427" y="503" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="446" y="503" class="node-line" style="font-size:15.0px" text-anchor="start">accepts management desired state</text>
<text x="427" y="526" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="446" y="526" class="node-line" style="font-size:15.0px" text-anchor="start">controllers own readiness</text>
</g>
<g id="operators">
<rect x="45" y="690" width="340" height="185" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="61" y="719" class="node-title" style="font-size:18.0px" text-anchor="start">Operators and operands</text>
<text x="62" y="745" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="81" y="745" class="node-line" style="font-size:15.0px" text-anchor="start">Subscriptions + operands</text>
<text x="62" y="768" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="81" y="768" class="node-line" style="font-size:15.0px" text-anchor="start">CNV, MCE/HyperShift + NMState</text>
<text x="62" y="791" class="node-line" style="font-size:14.9px" text-anchor="start">•</text>
<text x="81" y="791" class="node-line" style="font-size:14.9px" text-anchor="start">OLM and operator controllers reconcile</text>
</g>
<g id="network">
<rect x="430" y="690" width="340" height="185" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="446" y="719" class="node-title" style="font-size:18.0px" text-anchor="start">Parent network desired state</text>
<text x="447" y="745" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="466" y="745" class="node-line" style="font-size:15.0px" text-anchor="start">NNCP, NAD + Cilium resources</text>
<text x="447" y="768" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="466" y="768" class="node-line" style="font-size:15.0px" text-anchor="start">NMState and Cilium reconcile</text>
<text x="447" y="791" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="466" y="791" class="node-line" style="font-size:15.0px" text-anchor="start">runtime health remains separate</text>
</g>
<g id="lifecycle">
<rect x="815" y="690" width="340" height="185" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="831" y="719" class="node-title" style="font-size:18.0px" text-anchor="start">HostedCluster and NodePool</text>
<text x="832" y="745" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="851" y="745" class="node-line" style="font-size:15.0px" text-anchor="start">selected lifecycle namespace</text>
<text x="832" y="768" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="851" y="768" class="node-line" style="font-size:15.0px" text-anchor="start">HyperShift + KubeVirt watch APIs</text>
<text x="832" y="791" class="node-line" style="font-size:14.9px" text-anchor="start">•</text>
<text x="851" y="791" class="node-line" style="font-size:14.9px" text-anchor="start">bootstrap + runtime are controller-owned</text>
</g>
<g id="kubeconfig">
<rect x="90" y="990" width="420" height="165" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="106" y="1019" class="node-title" style="font-size:18.0px" text-anchor="start">HyperShift admin kubeconfig Secret</text>
<text x="107" y="1045" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="126" y="1045" class="node-line" style="font-size:15.0px" text-anchor="start">created in selected lifecycle namespace</text>
<text x="107" y="1068" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="126" y="1068" class="node-line" style="font-size:15.0px" text-anchor="start">contains tenant API endpoint + trust</text>
<text x="107" y="1091" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="126" y="1091" class="node-line" style="font-size:15.0px" text-anchor="start">secret value never enters Git</text>
</g>
<g id="registration">
<rect x="690" y="990" width="420" height="165" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="706" y="1019" class="node-title" style="font-size:18.0px" text-anchor="start">Argo cluster registration</text>
<text x="707" y="1045" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="726" y="1045" class="node-line" style="font-size:15.0px" text-anchor="start">Sync hook Job reads the kubeconfig</text>
<text x="707" y="1068" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="726" y="1068" class="node-line" style="font-size:15.0px" text-anchor="start">creates named cluster Secret</text>
<text x="707" y="1091" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="726" y="1091" class="node-line" style="font-size:15.0px" text-anchor="start">registers destination selected tenant</text>
</g>
<g id="tenant-api">
<rect x="90" y="1290" width="420" height="175" rx="14" fill="#FFF4D6" stroke="#7A869A" stroke-width="1.6"/>
<text x="106" y="1319" class="node-title" style="font-size:18.0px" text-anchor="start">selected tenant Kubernetes API</text>
<text x="107" y="1345" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="126" y="1345" class="node-line" style="font-size:15.0px" text-anchor="start">separate remote API endpoint</text>
<text x="107" y="1368" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="126" y="1368" class="node-line" style="font-size:15.0px" text-anchor="start">selected by destination.name</text>
<text x="107" y="1391" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="126" y="1391" class="node-line" style="font-size:15.0px" text-anchor="start">available only after HCP bootstrap</text>
</g>
<g id="guest-apps">
<rect x="690" y="1290" width="420" height="175" rx="14" fill="#F2ECFF" stroke="#7A869A" stroke-width="1.6"/>
<text x="706" y="1319" class="node-title" style="font-size:18.0px" text-anchor="start">Guest Day 2 desired state</text>
<text x="707" y="1345" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="726" y="1345" class="node-line" style="font-size:15.0px" text-anchor="start">Cilium + catalogs</text>
<text x="707" y="1368" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="726" y="1368" class="node-line" style="font-size:15.0px" text-anchor="start">policy, secrets + observability</text>
<text x="707" y="1391" class="node-line" style="font-size:15.0px" text-anchor="start">•</text>
<text x="726" y="1391" class="node-line" style="font-size:15.0px" text-anchor="start">reconciled through tenant API</text>
</g>
</g>
