<text x="56" y="535" class="node-line" style="font-size:16.0px" text-anchor="start">operators · networking · CSI · HCP</text>
</g>
<g id="guest">
<rect x="520" y="480" width="340" height="66" rx="14" fill="#FFF0EF" stroke="#7A869A" stroke-width="1.6"/>
<text x="536" y="509" class="node-title" style="font-size:18.0px" text-anchor="start">Registered hosted APIs</text>
<text x="536" y="535" class="node-line" style="font-size:16.0px" text-anchor="start">guest CNI · policy · applications</text>
</g>
</g>
<g id="connection-labels">
