<text x="56" y="129" class="node-title" style="font-size:18.0px" text-anchor="start">secure-ai-datacenter</text>
<text x="56" y="155" class="node-line" style="font-size:15.0px" text-anchor="start">validate + generate application values</text>
</g>
<g id="git">
<rect x="520" y="100" width="340" height="66" rx="14" fill="#F1F3F5" stroke="#7A869A" stroke-width="1.6"/>
<text x="536" y="129" class="node-title" style="font-size:18.0px" text-anchor="start">GitOps repository</text>
<text x="536" y="155" class="node-line" style="font-size:15.0px" text-anchor="start">bases / charts + generated cluster roots</text>
</g>
<g id="argo">
