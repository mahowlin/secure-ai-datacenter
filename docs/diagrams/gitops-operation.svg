<text x="301" y="319" class="node-title" style="font-size:18.0px" text-anchor="start">Argo CD</text>
<text x="301" y="345" class="node-line" style="font-size:15.0px" text-anchor="start">reads reviewed repository / ref / path</text>
</g>
