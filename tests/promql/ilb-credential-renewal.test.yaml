rule_files:
  - /dev/fd/3
evaluation_interval: 1m
tests:
  # The info series has schedule, but the success series does not. Matching
  # every label would incorrectly report a successful renewer as never run.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew",schedule="*/10 * * * *"}'
        values: '1x49'
      - series: 'kube_cronjob_status_last_successful_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '600x49'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '600x49'
      - series: 'kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '0x49'
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantAILBCredentialRenewalNeverSucceeded
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantAILBCredentialRenewalStale
        exp_alerts: []
      - eval_time: 47m
        alertname: TenantAILBCredentialRenewalStale
        exp_alerts:
          - exp_labels: {namespace: ilb-hcp-pip-controller, cronjob: example-tenant-a-ilb-credential-renew, severity: critical}
            exp_annotations: {summary: example-tenant-a ILB credential renewal last success is stale}

  # A fresh success resolves a firing stale alert on the next evaluation.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew",schedule="*/10 * * * *"}'
        values: '1x49'
      - series: 'kube_cronjob_status_last_successful_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '60x39 2400x10'
      - series: 'kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '0x49'
    alert_rule_test:
      - eval_time: 37m
        alertname: TenantAILBCredentialRenewalStale
        exp_alerts:
          - exp_labels: {namespace: ilb-hcp-pip-controller, cronjob: example-tenant-a-ilb-credential-renew, severity: critical}
            exp_annotations: {summary: example-tenant-a ILB credential renewal last success is stale}
      - eval_time: 42m
        alertname: TenantAILBCredentialRenewalStale
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew",schedule="*/10 * * * *"}'
        values: '1x30'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '60x30'
      - series: 'kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantAILBCredentialRenewalNeverSucceeded
        exp_alerts:
          - exp_labels: {namespace: ilb-hcp-pip-controller, cronjob: example-tenant-a-ilb-credential-renew, schedule: '*/10 * * * *', severity: critical}
            exp_annotations: {summary: example-tenant-a ILB credential renewal has never succeeded after scheduling}

  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '1x40'
      - series: 'kube_cronjob_status_last_successful_time{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '60x40'
      - series: 'kube_cronjob_spec_suspend{namespace="ilb-hcp-pip-controller",cronjob="example-tenant-a-ilb-credential-renew"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: TenantAILBCredentialRenewalStale
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantAILBCredentialRenewalSuspended
        exp_alerts:
          - exp_labels: {namespace: ilb-hcp-pip-controller, cronjob: example-tenant-a-ilb-credential-renew, severity: warning}
            exp_annotations: {summary: example-tenant-a ILB credential renewal is suspended}

  - interval: 1m
    input_series:
      - series: 'up{namespace="openshift-monitoring",job="kube-state-metrics",endpoint="https-main"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantAILBCredentialRenewalMissing
        exp_alerts:
          - exp_labels: {namespace: ilb-hcp-pip-controller, cronjob: example-tenant-a-ilb-credential-renew, severity: critical}
            exp_annotations: {summary: example-tenant-a ILB credential renewal CronJob is absent while kube-state-metrics is healthy}

  - interval: 1m
    input_series:
      - series: 'up{namespace="openshift-monitoring",job="kube-state-metrics",endpoint="https-main"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantAILBCredentialRenewalMissing
        exp_alerts: []
