apiVersion: saif.example.com/v1alpha1
kind: GitOpsExceptionRegister
metadata:
  name: gitops-exceptions
spec:
  exceptions:
    - path: .github/**
      category: bootstrap
      reason: Repository workflows and helper scripts. Not produced by the renderer.
      owner: platform
      decision:
        bead: example-note
    - path: docs/**
      category: bootstrap
      reason: Repository documentation. Not produced by the renderer.
      owner: platform
      decision:
        bead: example-note
    - path: scripts/**
      category: bootstrap
      reason: Repository maintenance scripts. Not produced by the renderer.
      owner: platform
      decision:
        bead: example-note
    - path: tests/**
      category: bootstrap
      reason: Repository tests. Not produced by the renderer.
      owner: platform
      decision:
        bead: example-note
    - path: .gitignore
      category: bootstrap
      reason: Git ignore rules for this repository.
      owner: platform
      decision:
        bead: example-note
    - path: assistant.md
      category: bootstrap
      reason: Repository instructions.
      owner: platform
      decision:
        bead: example-note
    - path: README.md
      category: bootstrap
      reason: Repository readme.
      owner: platform
      decision:
        bead: example-note
    - path: artifact-manifest.yaml
      category: bootstrap
      reason: Generated artifact manifest copied beside the GitOps tree.
      owner: platform
      decision:
        bead: example-note
    - path: clusters/INVENTORY.md
      category: bootstrap
      reason: Hand-written application inventory.
      owner: platform
      decision:
        bead: example-note
    - path: shared-infrastructure/.gitkeep
      category: bootstrap
      reason: Placeholder for a directory that is not rendered.
      owner: platform
      decision:
        bead: example-note
    - path: charts/hubble-timescape/**
      category: vendored-chart
      reason: Vendored upstream chart. The renderer owns the Application values.
      owner: platform
      decision:
        bead: example-note
    - path: charts/vector/**
      category: vendored-chart
      reason: Vendored upstream chart. The renderer owns the Application values.
      owner: platform
      decision:
        bead: example-note
    - path: charts/altinity-clickhouse-operator/**
      category: vendored-chart
      reason: Vendored ClickHouse chart selected by the example-management baseline Application. The renderer does not emit these files.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/Chart.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/templates/bgp-peering-policy.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
