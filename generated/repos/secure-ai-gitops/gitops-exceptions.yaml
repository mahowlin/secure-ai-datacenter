    - path: apps/sealed-secrets/*/hubble-timescape/timescape-object-writer.yaml
      category: downstream-execution
      reason: Runtime-enrichment ownership for encrypted Timescape writer credentials. The selected enrollment workflow and stager enforce exact namespace, name, AWS key set and live guest/controller/namespace/certificate identity; ciphertext is not renderer output.
      owner: platform
      decision:
        bead: example-note
