      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/templates/egress-gateway-policy.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/templates/ip-pool.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/templates/l2-announcement-policy.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/templates/postsync-restart-hook.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: charts/cilium-config/values.yaml
      category: vendored-chart
      reason: Local Cilium chart file. The renderer owns the resolved templates separately.
      owner: platform
      decision:
        bead: example-note
    - path: apps/sealed-secrets-controller/**
      category: downstream-execution
      reason: Downstream sealed-secrets controller manifests selected by an HCP base Application.
      owner: platform
      decision:
        bead: example-note
    - path: apps/sealed-secrets/_common/**
      category: downstream-execution
      reason: Downstream sealed-secret manifests selected by an HCP base Application.
      owner: platform
      decision:
        bead: example-note
    - path: apps/sealed-secrets/_gpu/**
      category: downstream-execution
      reason: Downstream sealed-secret manifests for the GPU stack.
      owner: platform
