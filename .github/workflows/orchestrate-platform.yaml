name: Orchestrate Platform

# PLATFORM 1.0 Orchestrator
#
# Deploys a single cluster through Day 0 (UCS) and Day 1 (OCP).
# Day 2 (GitOps) is automatic via ArgoCD - no workflow call needed.
#
# For multiple clusters, run this workflow multiple times.
#
# This is intentionally a "dumb" orchestrator:
# - No secrets stored here (except workflow trigger token)
# - No direct cluster access
# - Just sequences workflow calls and validates results

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster to deploy"
        required: true
        type: choice
        options:
          - ai-pod-1
          - ai-pod-2
          - ai-pod-3
          - ai-pod-4
      mode:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - full-deploy
          - day0-only
          - day1-only
      force_redeploy:
        description: "Force redeploy even if cluster is operational"
        required: false
        type: boolean
        default: false
      target_ref:
        description: "Target repo ref (branch/tag/sha)"
        required: false
        type: string
        default: "main"

# Prevent concurrent operations on the same cluster
concurrency:
  group: "cluster-${{ inputs.cluster }}"
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
  TARGET_REPO: mahowlin/saif-ai-pod

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.setup.outputs.request_id }}
    steps:
      - name: Setup
        id: setup
        run: |
          REQUEST_ID=$(uuidgen)
          echo "request_id=$REQUEST_ID" >> $GITHUB_OUTPUT
          echo "Generated request_id: $REQUEST_ID"

      - name: Validate GitHub token
        run: |
          if ! gh auth status &>/dev/null; then
            echo "::error::WORKFLOW_TRIGGER_TOKEN is invalid or missing"
            exit 1
          fi
          echo "✅ GitHub token valid"

      - name: Check sub-repo workflows exist
        run: |
          echo "Checking $TARGET_REPO workflows..."
          gh workflow view ucs-pipeline.yaml --repo $TARGET_REPO &>/dev/null || { echo "::error::ucs-pipeline.yaml not found"; exit 1; }
          gh workflow view openshift-pipeline.yaml --repo $TARGET_REPO &>/dev/null || { echo "::error::openshift-pipeline.yaml not found"; exit 1; }
          gh workflow view openshift-test.yaml --repo $TARGET_REPO &>/dev/null || { echo "::error::openshift-test.yaml not found"; exit 1; }
          echo "✅ saif-ai-pod workflows accessible"

          GITOPS_REPO="mahowlin/saif-gitops"
          gh workflow view workload-test.yaml --repo $GITOPS_REPO &>/dev/null || { echo "::error::workload-test.yaml not found in gitops repo"; exit 1; }
          echo "✅ saif-gitops workflows accessible"

      - name: Generate summary
        run: |
          echo "## Orchestrate Platform" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | ${{ inputs.cluster }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ inputs.mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Force Redeploy | ${{ inputs.force_redeploy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Ref | ${{ inputs.target_ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Request ID | ${{ steps.setup.outputs.request_id }} |" >> $GITHUB_STEP_SUMMARY

  day0:
    name: "Day 0: UCS"
    needs: validate
    if: inputs.mode == 'full-deploy' || inputs.mode == 'day0-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
    steps:
      - name: Trigger UCS Pipeline
        run: |
          PROFILE="saif-${{ inputs.cluster }}"
          echo "Triggering UCS pipeline for $PROFILE (request_id: $REQUEST_ID)..."
          for attempt in 1 2 3 4 5; do
            if gh workflow run ucs-pipeline.yaml \
              --repo $TARGET_REPO \
              --ref "${{ inputs.target_ref }}" \
              -f operation="Activate - Apply config to server" \
              -f server_target="$PROFILE" \
              -f request_id="$REQUEST_ID" 2>&1; then
              echo "✅ Workflow triggered successfully"
              break
            fi
            if [ $attempt -eq 5 ]; then echo "::error::Failed to trigger workflow after 5 attempts"; exit 1; fi
            echo "  Trigger failed (attempt $attempt/5), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

      - name: Wait for UCS Pipeline
        run: |
          echo "Waiting for workflow to start..."
          sleep 60

          # Find run by request_id in displayTitle
          for i in {1..30}; do
            RUN_ID=$(gh run list \
              --repo $TARGET_REPO \
              --workflow ucs-pipeline.yaml \
              --limit 10 \
              --json databaseId,displayTitle,status,event \
              --jq ".[] | select(.displayTitle | contains(\"rid=$REQUEST_ID\")) | select(.event == \"workflow_dispatch\") | .databaseId" | head -1)

            if [ -n "$RUN_ID" ]; then
              echo "Found run $RUN_ID"
              break
            fi
            echo "Run not found yet, waiting... ($i/30)"
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find triggered UCS run with request_id $REQUEST_ID"
            exit 1
          fi

          # Poll run status every 60s (instead of gh run watch which polls every 3s)
          echo "Polling run $RUN_ID every 60s..."
          CONSECUTIVE_FAILURES=0
          MAX_RETRIES=5
          while true; do
            RESULT=$(gh run view "$RUN_ID" --repo "$TARGET_REPO" --json status,conclusion 2>&1) || {
              CONSECUTIVE_FAILURES=$((CONSECUTIVE_FAILURES + 1))
              if [ $CONSECUTIVE_FAILURES -ge $MAX_RETRIES ]; then
                echo "::error::Failed to query run status after $MAX_RETRIES consecutive failures: $RESULT"
                exit 1
              fi
              BACKOFF=$((CONSECUTIVE_FAILURES * 60))
              echo "  API error (attempt $CONSECUTIVE_FAILURES/$MAX_RETRIES), retrying in ${BACKOFF}s..."
              sleep $BACKOFF
              continue
            }
            CONSECUTIVE_FAILURES=0
            STATUS=$(echo "$RESULT" | jq -r '.status')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')
            echo "  Run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Run $RUN_ID completed successfully"
                break
              else
                echo "::error::Run $RUN_ID failed (conclusion: $CONCLUSION)"
                echo "Details: https://github.com/$TARGET_REPO/actions/runs/$RUN_ID"
                exit 1
              fi
            fi
            sleep 60
          done

  day1:
    name: "Day 1: OpenShift"
    needs: [validate, day0]
    if: always() && needs.validate.result == 'success' && (inputs.mode == 'full-deploy' || inputs.mode == 'day1-only') && (needs.day0.result == 'success' || needs.day0.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
    steps:
      - name: Trigger OpenShift Pipeline
        run: |
          echo "Triggering OpenShift pipeline for ${{ inputs.cluster }} (request_id: $REQUEST_ID)..."
          for attempt in 1 2 3 4 5; do
            if gh workflow run openshift-pipeline.yaml \
              --repo $TARGET_REPO \
              --ref "${{ inputs.target_ref }}" \
              -f cluster_name="${{ inputs.cluster }}" \
              -f cni_type="Cilium" \
              -f validate=true \
              -f deploy=true \
              -f post_install=true \
              -f test=true \
              -f force_deploy="${{ inputs.force_redeploy }}" \
              -f request_id="$REQUEST_ID" 2>&1; then
              echo "✅ Workflow triggered successfully"
              break
            fi
            if [ $attempt -eq 5 ]; then echo "::error::Failed to trigger workflow after 5 attempts"; exit 1; fi
            echo "  Trigger failed (attempt $attempt/5), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

      - name: Wait for OpenShift Pipeline
        run: |
          echo "Waiting for workflow to start..."
          sleep 60

          for i in {1..30}; do
            RUN_ID=$(gh run list \
              --repo $TARGET_REPO \
              --workflow openshift-pipeline.yaml \
              --limit 10 \
              --json databaseId,displayTitle,status,event \
              --jq ".[] | select(.displayTitle | contains(\"rid=$REQUEST_ID\")) | select(.event == \"workflow_dispatch\") | .databaseId" | head -1)

            if [ -n "$RUN_ID" ]; then
              echo "Found run $RUN_ID"
              break
            fi
            echo "Run not found yet, waiting... ($i/30)"
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find triggered OpenShift run with request_id $REQUEST_ID"
            exit 1
          fi

          # Poll run status every 60s (instead of gh run watch which polls every 3s)
          echo "Polling run $RUN_ID every 60s (this may take 60-90 minutes)..."
          CONSECUTIVE_FAILURES=0
          MAX_RETRIES=5
          while true; do
            RESULT=$(gh run view "$RUN_ID" --repo "$TARGET_REPO" --json status,conclusion 2>&1) || {
              CONSECUTIVE_FAILURES=$((CONSECUTIVE_FAILURES + 1))
              if [ $CONSECUTIVE_FAILURES -ge $MAX_RETRIES ]; then
                echo "::error::Failed to query run status after $MAX_RETRIES consecutive failures: $RESULT"
                exit 1
              fi
              BACKOFF=$((CONSECUTIVE_FAILURES * 60))
              echo "  API error (attempt $CONSECUTIVE_FAILURES/$MAX_RETRIES), retrying in ${BACKOFF}s..."
              sleep $BACKOFF
              continue
            }
            CONSECUTIVE_FAILURES=0
            STATUS=$(echo "$RESULT" | jq -r '.status')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')
            echo "  Run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Run $RUN_ID completed successfully"
                break
              else
                echo "::error::Run $RUN_ID failed (conclusion: $CONCLUSION)"
                echo "Details: https://github.com/$TARGET_REPO/actions/runs/$RUN_ID"
                exit 1
              fi
            fi
            sleep 60
          done

  day2:
    name: "Day 2: Workload Test"
    needs: [validate, day0, day1]
    if: always() && needs.validate.result == 'success' && (inputs.mode == 'full-deploy' || inputs.mode == 'day1-only') && needs.day1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUEST_ID: ${{ needs.validate.outputs.request_id }}
      GITOPS_REPO: mahowlin/saif-gitops
    steps:
      - name: Trigger Workload Test
        run: |
          echo "Triggering workload test for ${{ inputs.cluster }} (request_id: $REQUEST_ID)..."
          for attempt in 1 2 3 4 5; do
            if gh workflow run workload-test.yaml \
              --repo $GITOPS_REPO \
              --ref "main" \
              -f cluster_name="${{ inputs.cluster }}" \
              -f convergence_timeout=1800 \
              -f request_id="$REQUEST_ID" 2>&1; then
              echo "✅ Workflow triggered successfully"
              break
            fi
            if [ $attempt -eq 5 ]; then echo "::error::Failed to trigger workflow after 5 attempts"; exit 1; fi
            echo "  Trigger failed (attempt $attempt/5), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

      - name: Wait for Workload Test
        run: |
          echo "Waiting for workflow to start..."
          sleep 60

          for i in {1..30}; do
            RUN_ID=$(gh run list \
              --repo $GITOPS_REPO \
              --workflow workload-test.yaml \
              --limit 10 \
              --json databaseId,displayTitle,status,event \
              --jq ".[] | select(.displayTitle | contains(\"rid=$REQUEST_ID\")) | select(.event == \"workflow_dispatch\") | .databaseId" | head -1)

            if [ -n "$RUN_ID" ]; then
              echo "Found run $RUN_ID"
              break
            fi
            echo "Run not found yet, waiting... ($i/30)"
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find triggered workload test with request_id $REQUEST_ID"
            exit 1
          fi

          # Poll run status every 60s (instead of gh run watch which polls every 3s)
          echo "Polling run $RUN_ID every 60s (ArgoCD convergence may take up to 30 minutes)..."
          CONSECUTIVE_FAILURES=0
          MAX_RETRIES=5
          while true; do
            RESULT=$(gh run view "$RUN_ID" --repo "$GITOPS_REPO" --json status,conclusion 2>&1) || {
              CONSECUTIVE_FAILURES=$((CONSECUTIVE_FAILURES + 1))
              if [ $CONSECUTIVE_FAILURES -ge $MAX_RETRIES ]; then
                echo "::error::Failed to query run status after $MAX_RETRIES consecutive failures: $RESULT"
                exit 1
              fi
              BACKOFF=$((CONSECUTIVE_FAILURES * 60))
              echo "  API error (attempt $CONSECUTIVE_FAILURES/$MAX_RETRIES), retrying in ${BACKOFF}s..."
              sleep $BACKOFF
              continue
            }
            CONSECUTIVE_FAILURES=0
            STATUS=$(echo "$RESULT" | jq -r '.status')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')
            echo "  Run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Run $RUN_ID completed successfully"
                break
              else
                echo "::error::Run $RUN_ID failed (conclusion: $CONCLUSION)"
                echo "Details: https://github.com/$GITOPS_REPO/actions/runs/$RUN_ID"
                exit 1
              fi
            fi
            sleep 60
          done

  summary:
    name: Summary
    needs: [validate, day0, day1, day2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Summary
        run: |
          echo "## Platform Summary: ${{ inputs.cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Day 0 (UCS) | ${{ needs.day0.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Day 1 (OCP + Infra Test) | ${{ needs.day1.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Day 2 (Workload Test) | ${{ needs.day2.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Request ID:** ${{ needs.validate.outputs.request_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.day2.result }}" == "success" ]; then
            echo "✅ **${{ inputs.cluster }} deployment successful — infrastructure and workloads verified**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.day1.result }}" == "success" ]; then
            echo "⚠️ Infrastructure deployed and tested, workload test pending/failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment incomplete - check failed stages" >> $GITHUB_STEP_SUMMARY
          fi
